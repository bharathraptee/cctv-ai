mqtt:
  enabled: false

# OpenVINO Detector & YOLOv8 Model Configuration (Frigate 0.14)
detectors:
  ov:
    type: openvino
    device: CPU

model:
  path: /config/model_cache/yolov8n.onnx
  labelmap_path: /config/model_cache/coco-80.txt
  model_type: yolo-generic
  width: 640
  height: 640
  input_tensor: nchw
  input_pixel_format: rgb
  input_dtype: float

# Global detection and object tracking settings (Applies to all cameras automatically)
objects:
  track:
    - person
    - motorcycle

birdseye:
  enabled: true
  mode: continuous

# Global recording retention configuration
record:
  enabled: true
  alerts:
    retain:
      days: 14
      mode: active_objects
  detections:
    retain:
      days: 7
      mode: motion

# Enable go2rtc for ultra low-latency WebRTC/MSE streaming and stream sharing
# Add your cameras below. Replace <username>, <password>, and <camera_ip> with your actual camera details.
go2rtc:
  streams:
    camera_1:
      - rtsp://admin:password@<camera_ip>:554/stream1
    # camera_2:
    #   - rtsp://admin:password@<camera_ip>:554/stream1

# Camera definitions
cameras:
  camera_1:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_1
          input_args: preset-rtsp-restream
          roles:
            - record
            - detect
    detect:
      enabled: true
      width: 1920
      height: 1080
      fps: 5

    # Custom zones can be drawn interactively using your mouse in the Frigate UI (http://localhost:5000)!
    # Go to: Settings -> Cameras -> camera_1 -> Zones
    # zones:
    #   entrance:
    #     coordinates: 0.1,0.2,0.3,0.4...

snapshots:
  timestamp: true
  crop: true
