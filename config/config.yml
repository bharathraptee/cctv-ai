mqtt:
  enabled: false

# OpenVINO Detector & YOLOv8 Model Configuration (Frigate 0.14)
detectors:
  ov:
    type: openvino
    device: CPU

model:
  path: /config/model_cache/yolov8n.onnx
  labelmap_path: /config/model_cache/coco-80.txt
  model_type: yolo-generic
  width: 640
  height: 640
  input_tensor: nchw
  input_pixel_format: rgb
  input_dtype: float

# Global detection and object tracking settings (Applies to all cameras automatically)
objects:
  track:
    - person
    - motorcycle

birdseye:
  enabled: true
  mode: continuous

# Global recording retention configuration
record:
  enabled: true
  alerts:
    retain:
      days: 14
      mode: active_objects
  detections:
    retain:
      days: 7
      mode: motion

# Enable go2rtc for ultra low-latency WebRTC/MSE streaming and stream sharing
# Add your cameras below. Replace <username>, <password>, and <camera_ip> with your actual camera details.
go2rtc:
  streams:
    camera_1:
      - rtsp://admin:password@<camera_ip>:554/stream1
    # camera_2:
    #   - rtsp://admin:password@<camera_ip>:554/stream1

# Camera definitions
    showroom:
      - rtsp://admin:CCTV@Raptee@10.0.0.157:554/stream1
    capitol_:
      - ffmpeg:rtsp://admin:CCTV@Raptee@10.0.0.56:554/stream1
    quality_inspection:
      - ffmpeg:rtsp://admin:CCTV@Raptee@10.0.0.41:554/stream1
    electronics_lab:
      - ffmpeg:rtsp://admin:CCTV@Raptee@10.0.0.4:554/stream1
cameras:
  showroom:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://admin:CCTV@Raptee@10.0.0.157:554/stream1
          roles:
            - detect
    detect:
      width: 1280
      height: 720
    live:
      streams:
        Stream 1: showroom
    zones:
      t30_skeleton:
        coordinates: 0.265,0.306,0.4,0.455,0.616,0.322,0.546,0.149
        enabled: true
        inertia: 3
        loitering_time: 10
        friendly_name: T30 Skeleton
      showroom_sofa:
        coordinates: 0.007,0.519,0.16,0.994,0.549,0.734,0.227,0.308
        enabled: true
        inertia: 3
        loitering_time: 20
        friendly_name: showroom sofa
      footfall:
        coordinates: 0.593,0.225,0.652,0.282,0.737,0.175,0.699,0.125
        enabled: true
        inertia: 2
        loitering_time: 0
  capitol_:
    enabled: true
    friendly_name: 'capitol '
    ffmpeg:
      inputs:
        - path: rtsp://admin:CCTV@Raptee@10.0.0.56:554/stream1
          roles:
            - detect
    detect:
      width: 1280
      height: 720
    live:
      streams:
        Stream 1: capitol_
    zones:
      capitol_sofa:
        coordinates: 0.357,0.29,0.695,0.97,0.986,0.575,0.678,0.201
        enabled: true
        inertia: 3
        loitering_time: 5
        friendly_name: capitol sofa
  quality_inspection:
    enabled: true
    friendly_name: quality inspection
    ffmpeg:
      inputs:
        - path: rtsp://admin:CCTV@Raptee@10.0.0.41:554/stream1
          roles:
            - detect
    detect:
      width: 1280
      height: 720
    live:
      streams:
        Stream 1: quality_inspection
    zones:
      qi_table_:
        coordinates: 0.275,0.513,0.572,0.885,0.792,0.557,0.463,0.322
        enabled: true
        inertia: 3
        loitering_time: 5
        friendly_name: 'qi table '
  electronics_lab:
    enabled: true
    friendly_name: electronics lab
    ffmpeg:
      inputs:
        - path: rtsp://admin:CCTV@Raptee@10.0.0.4:554/stream1
          roles:
            - detect
    detect:
      width: 1280
      height: 720
    live:
      streams:
        Stream 1: electronics_lab
    zones:
      electronics_t30_red:
        coordinates: 0.081,0.421,0.283,0.891,0.565,0.455,0.369,0.177
        enabled: true
        inertia: 3
        loitering_time: 0
        friendly_name: electronics t30 red
snapshots:
  timestamp: true
  crop: true
version: 0.18-0
