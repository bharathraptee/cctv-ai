services:
  frigate:
    container_name: frigate-showroom
    image: ghcr.io/blakeblackshear/frigate:stable
    privileged: true
    restart: unless-stopped
    shm_size: "256mb"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
      - ./media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "5000:5000"       # Web UI & API
      - "8971:8971"       # HTTPS Web UI & API
      - "8554:8554"       # RTSP feeds
      - "8555:8555/tcp"   # WebRTC
      - "8555:8555/udp"   # WebRTC
    environment:
      FRIGATE_RTSP_PASSWORD: "admin"

  dashboard:
    container_name: showroom-dashboard
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frigate
